<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEO · Diseña tu organización</title>
<meta name="description" content="Dibuja tu organigrama y descubre si tu empresa aguanta el próximo salto de ventas.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="hero">
  <div class="stick" id="stick">
    <svg class="bg" aria-hidden="true">
      <defs><pattern id="pt" width="220" height="130" patternUnits="userSpaceOnUse">
        <path d="M110 22V52M45 52H175M45 52V84M110 52V84M175 52V84" stroke="#fff" stroke-opacity=".18" stroke-width="1.5" fill="none"/>
        <g fill="#fff" fill-opacity=".22"><circle cx="110" cy="18" r="9"/><circle cx="45" cy="90" r="6"/><circle cx="110" cy="90" r="6"/><circle cx="175" cy="90" r="6"/></g>
      </pattern></defs>
      <rect width="100%" height="100%" fill="url(#pt)"/>
    </svg>
    <div class="hc"><h1>DEO</h1><p>¿Tu estructura aguanta el próximo salto de ventas?</p><small>Desliza ↓</small></div>
  </div>
</section>

<section class="cta">
  <button id="inicio" class="inicio" type="button"><b>Empieza a diseñar tu organización</b><span>Dibuja, conecta y mira cómo reacciona →</span></button>
</section>

<section class="taller" id="taller">
  <div class="lienzo">
    <div class="hint" id="hint"></div>
    <svg id="org" viewBox="0 0 1000 640" role="img" aria-label="Organigrama libre"></svg>
  </div>

  <aside class="barra">
    <div class="score">
      <div class="medidor" id="medidor"><span id="indice">–</span><small>de 100</small></div>
      <div><b id="veredicto">Añade personas</b><i id="delta" class="delta"></i>
        <p class="arq" id="arq"></p><p class="mini" id="arqT"></p></div>
    </div>

    <h3>Dibuja</h3>
    <div class="tools">
      <button type="button" id="bAdd">＋ Persona</button>
      <button type="button" id="bCon" aria-pressed="false">⛓ 2.º jefe</button>
      <button type="button" id="bOrd">⇅ Ordenar</button>
      <button type="button" id="bDel">✕ Quitar</button>
    </div>
    <div class="sel">
      <input id="nombre" maxlength="18" placeholder="Nombre o cargo">
      <div class="chips" id="areas"></div>
    </div>

    <h3>Ejemplos</h3>
    <div class="tools" id="plant">
      <button type="button" data-p="semilla" aria-pressed="false">Startup</button>
      <button type="button" data-p="mype" aria-pressed="false">Mype</button>
      <button type="button" data-p="agencia" aria-pressed="false">Agencia</button>
      <button type="button" id="bClr">Vacío</button>
    </div>

    <h3>Tu empresa</h3>
    <label class="rng">Decisiones que esperan a la dirección <output id="oCent">60%</output>
      <input type="range" id="cent" min="0" max="100" step="5" value="60"></label>
    <p class="mini">Cómo se coordinan</p>
    <div class="chips" id="coord"></div>

    <h3>Salud</h3>
    <div id="dims" class="dims"></div>
    <ul id="alertas" class="alertas"></ul>
    <div id="plan" class="plan"></div>
    <p class="mini">Base: Mintzberg, Daft y Galbraith. Auditoría orientativa.</p>
  </aside>
</section>

<script src="app.js"></script>
</body>
</html>
